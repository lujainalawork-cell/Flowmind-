<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="header">
  <span class="mark">
    <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
      <path d="M6 21c4-10 16-10 20 0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="16" cy="12" r="2.8" fill="#C7EF66"/>
    </svg>
  </span>
  <div>
    <div class="brand">FlowMind</div>
    <div class="tagline">AI Business Consultant</div>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">…</span></div>
</div>

<div class="section">
  <div class="eyebrow" id="scope-label">This analysis</div>
  <div class="stats">
    <div class="stat"><div class="v" id="s-apps">—</div><div class="l">Apps observed</div></div>
    <div class="stat"><div class="v" id="s-events">—</div><div class="l">Events captured</div></div>
    <div class="stat"><div class="v" id="s-time">—</div><div class="l">Time analyzed</div></div>
    <div class="stat"><div class="v" id="s-switches">—</div><div class="l">App switches</div></div>
  </div>
</div>

<div class="section">
  <div class="eyebrow">Approved applications</div>
  <div class="approved" id="approved"></div>
</div>

<div class="section">
  <div class="eyebrow">Latest signal</div>
  <div id="insight"></div>
</div>

<div class="controls">
  <button class="btn btn-secondary" id="pause">Pause monitoring</button>
  <button class="btn btn-primary" id="dashboard">Open FlowMind</button>
</div>

<div class="footnote" id="footnote">Approved applications only · no content is collected</div>

<script src="popup.js"></script>
</body>
</html>
